<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPENSE TRACKER</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
    <form id="expenseForm">
        <h2>Add Expense</h2>
        <div>
            <label for = "Description>"></label>
            <input type="text" id="Description" required placeholder="">
         </div>
         <div>
            <label for = "Amount"></label>
            <input type="text" id="Amount" step="0.1" required placeholder="" >  
              </div>
              <div>
                <label for ="Currency"></label>
                    <select  id="Currency">
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="KES">KES</option>

                    </select>
                
              </div>
              <div>
                <label for = "Category"></label>
                <select id="Catergory">
                <option value="Food">Food</option>
                 <option value="Transport">Transport</option>
                  <option value="Shopping">Shopping</option>
                   <option value="Accomodation">Accomodation</option>
                    <option value="Other">Other</option>
                </select>

              </div>
              <button type="submit">Add Expense</button>

    </form>
    </section>
    <section>
        <label for="categoryFilter">Filter by catergory</label>
        <select id="catergoryFilter">
            <option value="All">All catergories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Accomadation">Accomodation</option>
            <option value="Other">Other</option>
        </select>
    </section>
    <script type ="module" src="src/main.js"></script>
</body>
</html>
